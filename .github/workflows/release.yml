name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) Compila en las 3 plataformas y sube los bundles como artifacts
  # ─────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            os: linux
            args: '--bundles deb,rpm,appimage'
          - platform: windows-latest
            os: windows
            args: '--bundles nsis,msi'
          - platform: macos-latest
            os: macos
            args: '--bundles app,dmg'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build ${{ matrix.args }}

      - name: Collect Linux bundles
        if: matrix.os == 'linux'
        run: |
          mkdir -p dist-assets
          cp src-tauri/target/release/bundle/deb/*.deb dist-assets/
          cp src-tauri/target/release/bundle/rpm/*.rpm dist-assets/
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-assets/

      - name: Collect Windows bundles
        if: matrix.os == 'windows'
        run: |
          mkdir -p dist-assets
          cp src-tauri/target/release/bundle/nsis/*.exe dist-assets/
          cp src-tauri/target/release/bundle/msi/*.msi dist-assets/

      - name: Collect macOS bundles
        if: matrix.os == 'macos'
        run: |
          mkdir -p dist-assets
          cp src-tauri/target/release/bundle/dmg/*.dmg dist-assets/
          tar -czf "dist-assets/gus_${TAG#v}.app.tar.gz" -C src-tauri/target/release/bundle/macos gus.app

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: dist-assets/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 2) Firma los instaladores de Windows con SignPath.
  #    Solo se activa cuando existen los secrets (ver abajo);
  #    sin ellos el job termina sin hacer nada y el .exe/.msi
  #    se publica sin firmar (como hasta ahora).
  #
  #    Secrets requeridos (Settings → Secrets → Actions):
  #      SIGNPATH_API_TOKEN
  #      SIGNPATH_ORGANIZATION_ID
  #      SIGNPATH_PROJECT_SLUG
  #      SIGNPATH_SIGNING_POLICY_SLUG
  #
  #    Y en SignPath → tu proyecto → Artifact Configurations → Add → Custom
  #    con slug "windows-installers" y este XML:
  #
  #      <artifact-configuration xmlns="http://signpath.io/artifact-configuration/v1">
  #        <zip-file>
  #          <pe-file path="*.exe">
  #            <authenticode-sign/>
  #          </pe-file>
  #          <msi-file path="*.msi">
  #            <authenticode-sign/>
  #          </msi-file>
  #        </zip-file>
  #      </artifact-configuration>
  # ─────────────────────────────────────────────────────────────
  sign-windows:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: bundles-windows
          path: unsigned

      - name: Upload artifact for signing
        if: env.SIGNPATH_API_TOKEN != ''
        id: sp-input
        uses: actions/upload-artifact@v4
        with:
          name: signpath-input
          path: unsigned/
          if-no-files-found: error

      - name: Submit signing request
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-installers
          github-artifact-id: ${{ steps.sp-input.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed installers
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: signed/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 3) Publica TODO en un único draft release (sin carreras)
  # ─────────────────────────────────────────────────────────────
  release:
    needs: [build, sign-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux bundles
        uses: actions/download-artifact@v4
        with:
          name: bundles-linux
          path: all-assets

      - name: Download macOS bundles
        uses: actions/download-artifact@v4
        with:
          name: bundles-macos
          path: all-assets

      - name: Download Windows installers (sin firma)
        if: env.SIGNPATH_API_TOKEN == ''
        uses: actions/download-artifact@v4
        with:
          name: bundles-windows
          path: all-assets

      - name: Download Windows installers (firmados)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: windows-signed
          path: all-assets

      - name: Create draft release
        run: |
          ls -la all-assets/
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --draft \
            --title "Gus $TAG" \
            --notes-file .github/release-notes.md \
            all-assets/*
