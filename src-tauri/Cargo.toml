[package]
name = "gus"
version = "0.4.0"
description = "Gus — notas y tareas locales en Markdown (escritorio con Tauri v2)"
authors = ["victorrubilar-dev"]
license = "GPL-3.0-or-later"
repository = "https://github.com/victorrubilar-dev/gus"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "~2.3"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Miniaturas para el selector de imágenes del menú «/» (y nada más).
image = "0.25"
# Descarga del instalador de una release (solo a petición del usuario, ver PRIVACY.md).
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
notify-debouncer-mini = "0.7.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
